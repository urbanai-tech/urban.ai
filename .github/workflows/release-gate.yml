name: Release gate - frontend tsc, build and Playwright

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Frontend - tsc + next build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Urban-front-main

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Type-check
        run: npx tsc --noEmit

      - name: Next.js production build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || secrets.NEXT_PUBLIC_API_URL_STAGING || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.E2E_BASE_URL || secrets.NEXT_PUBLIC_APP_URL_STAGING || 'https://urban-ai-frontend-staging-staging.up.railway.app' }}
          NEXT_PUBLIC_PRELAUNCH_MODE: 'false'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          NEXTAUTH_SECRET: ci_dummy_secret_not_for_prod
          NEXTAUTH_URL: http://localhost:3000
        run: npm run build

  e2e-public:
    name: Playwright - public smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    defaults:
      run:
        working-directory: Urban-front-main

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json

      - name: Install deps
        run: npm ci --legacy-peer-deps

      - name: Build local smoke app
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.E2E_API_URL || secrets.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          NEXT_PUBLIC_APP_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL || 'https://urban-ai-frontend-staging-staging.up.railway.app' }}
          NEXT_PUBLIC_PRELAUNCH_MODE: 'false'
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          NEXTAUTH_SECRET: ci_dummy_secret_not_for_prod
          NEXTAUTH_URL: http://127.0.0.1:3000
        run: npm run build

      - name: Start local smoke app
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          PORT=3000 HOSTNAME=127.0.0.1 nohup node .next/standalone/server.js > /tmp/urban-next.log 2>&1 &
          for i in {1..45}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/urban-next.log
          exit 1

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run public smoke specs
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_API_URL: ${{ vars.E2E_API_URL || secrets.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
        run: |
          npx playwright test \
            --project=chromium \
            e2e/release-gate-public.spec.ts \
            e2e/smoke.spec.ts \
            e2e/prelaunch-waitlist-analytics.spec.ts \
            e2e/a11y.spec.ts

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-public
          path: Urban-front-main/playwright-report/
          retention-days: 7

  e2e-authenticated:
    name: Playwright - authenticated smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: build
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          vars.E2E_AUTHENTICATED_SMOKE_ENABLED == 'true'
        ) ||
        (
          github.event_name == 'pull_request' &&
          vars.E2E_AUTHENTICATED_SMOKE_ENABLED == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}
    defaults:
      run:
        working-directory: Urban-front-main

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json

      - name: Preflight authenticated smoke
        id: auth_preflight
        env:
          E2E_TARGET_ENV: staging
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL || 'https://urban-ai-frontend-staging-staging.up.railway.app' }}
          E2E_API_URL: ${{ vars.E2E_API_URL || secrets.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.E2E_AUTH_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_EMAIL || secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.ENTERPRISE_GATE_ADMIN_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.ENTERPRISE_GATE_ADMIN_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
          E2E_HOST_EMAIL: ${{ secrets.E2E_HOST_EMAIL || secrets.ENTERPRISE_GATE_HOST_EMAIL }}
          E2E_HOST_PASSWORD: ${{ secrets.E2E_HOST_PASSWORD || secrets.ENTERPRISE_GATE_HOST_PASSWORD }}
          ENTERPRISE_GATE_ADMIN_EMAIL: ${{ secrets.ENTERPRISE_GATE_ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          ENTERPRISE_GATE_ADMIN_PASSWORD: ${{ secrets.ENTERPRISE_GATE_ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
          ENTERPRISE_GATE_HOST_EMAIL: ${{ secrets.ENTERPRISE_GATE_HOST_EMAIL || secrets.E2E_HOST_EMAIL }}
          ENTERPRISE_GATE_HOST_PASSWORD: ${{ secrets.ENTERPRISE_GATE_HOST_PASSWORD || secrets.E2E_HOST_PASSWORD }}
        run: node scripts/staging-gate-preflight.mjs --gate authenticated-smoke

      - name: Install deps
        if: steps.auth_preflight.outputs.should_run == 'true'
        run: npm ci --legacy-peer-deps

      - name: Install Playwright browsers
        if: steps.auth_preflight.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Run authenticated smoke specs
        if: steps.auth_preflight.outputs.should_run == 'true'
        env:
          E2E_BASE_URL: ${{ vars.E2E_BASE_URL || secrets.E2E_BASE_URL || 'https://urban-ai-frontend-staging-staging.up.railway.app' }}
          E2E_API_URL: ${{ vars.E2E_API_URL || secrets.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.E2E_AUTH_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
          E2E_AUTH_EMAIL: ${{ secrets.E2E_EMAIL || secrets.E2E_AUTH_EMAIL }}
          E2E_AUTH_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL || secrets.ENTERPRISE_GATE_ADMIN_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD || secrets.ENTERPRISE_GATE_ADMIN_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
          E2E_HOST_EMAIL: ${{ secrets.E2E_HOST_EMAIL || secrets.ENTERPRISE_GATE_HOST_EMAIL }}
          E2E_HOST_PASSWORD: ${{ secrets.E2E_HOST_PASSWORD || secrets.ENTERPRISE_GATE_HOST_PASSWORD }}
          ENTERPRISE_GATE_ADMIN_EMAIL: ${{ secrets.ENTERPRISE_GATE_ADMIN_EMAIL || secrets.E2E_ADMIN_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          ENTERPRISE_GATE_ADMIN_PASSWORD: ${{ secrets.ENTERPRISE_GATE_ADMIN_PASSWORD || secrets.E2E_ADMIN_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
          ENTERPRISE_GATE_HOST_EMAIL: ${{ secrets.ENTERPRISE_GATE_HOST_EMAIL || secrets.E2E_HOST_EMAIL }}
          ENTERPRISE_GATE_HOST_PASSWORD: ${{ secrets.ENTERPRISE_GATE_HOST_PASSWORD || secrets.E2E_HOST_PASSWORD }}
          E2E_ALPHA_EMAIL: ${{ secrets.E2E_ALPHA_EMAIL }}
        run: |
          npx playwright test \
            --project=chromium \
            authenticated-smoke.spec.ts \
            authenticated-mobile-smoke.spec.ts

      - name: Upload Playwright report
        if: always() && steps.auth_preflight.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-authenticated
          path: Urban-front-main/playwright-report/
          retention-days: 7

  enterprise-live-gate:
    name: Enterprise live gate - staging evidence
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'push' &&
          vars.ENTERPRISE_GATE_ENABLED == 'true'
        ) ||
        (
          github.event_name == 'pull_request' &&
          vars.ENTERPRISE_GATE_ENABLED == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        )
      }}

    steps:
      - uses: actions/checkout@v6.0.2

      - name: Setup Node
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'

      - name: Preflight enterprise live gate
        id: enterprise_preflight
        env:
          ENTERPRISE_GATE_ENV: staging
          ENTERPRISE_GATE_BACKEND_URL: ${{ vars.ENTERPRISE_GATE_BACKEND_URL || vars.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          ENTERPRISE_GATE_FRONTEND_URL: ${{ vars.ENTERPRISE_GATE_FRONTEND_URL || vars.E2E_BASE_URL || 'https://urban-ai-frontend-staging-staging.up.railway.app' }}
          ENTERPRISE_GATE_HEALTH_TOKEN: ${{ secrets.ENTERPRISE_GATE_HEALTH_TOKEN || secrets.HEALTH_READINESS_TOKEN }}
          ENTERPRISE_GATE_ADMIN_JWT: ${{ secrets.ENTERPRISE_GATE_ADMIN_JWT }}
          ENTERPRISE_GATE_HOST_JWT: ${{ secrets.ENTERPRISE_GATE_HOST_JWT }}
          ENTERPRISE_GATE_ADMIN_EMAIL: ${{ secrets.ENTERPRISE_GATE_ADMIN_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          ENTERPRISE_GATE_ADMIN_PASSWORD: ${{ secrets.ENTERPRISE_GATE_ADMIN_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
          ENTERPRISE_GATE_HOST_EMAIL: ${{ secrets.ENTERPRISE_GATE_HOST_EMAIL || secrets.E2E_HOST_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          ENTERPRISE_GATE_HOST_PASSWORD: ${{ secrets.ENTERPRISE_GATE_HOST_PASSWORD || secrets.E2E_HOST_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
        run: node Urban-front-main/scripts/staging-gate-preflight.mjs --gate enterprise-live-gate

      - name: Resolve enterprise gate JWTs
        if: steps.enterprise_preflight.outputs.should_run == 'true'
        env:
          ENTERPRISE_GATE_BACKEND_URL: ${{ vars.ENTERPRISE_GATE_BACKEND_URL || vars.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          ENTERPRISE_GATE_ADMIN_JWT: ${{ secrets.ENTERPRISE_GATE_ADMIN_JWT }}
          ENTERPRISE_GATE_HOST_JWT: ${{ secrets.ENTERPRISE_GATE_HOST_JWT }}
          ENTERPRISE_GATE_ADMIN_EMAIL: ${{ secrets.ENTERPRISE_GATE_ADMIN_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          ENTERPRISE_GATE_ADMIN_PASSWORD: ${{ secrets.ENTERPRISE_GATE_ADMIN_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
          ENTERPRISE_GATE_HOST_EMAIL: ${{ secrets.ENTERPRISE_GATE_HOST_EMAIL || secrets.E2E_HOST_EMAIL || secrets.E2E_AUTH_EMAIL || secrets.E2E_EMAIL }}
          ENTERPRISE_GATE_HOST_PASSWORD: ${{ secrets.ENTERPRISE_GATE_HOST_PASSWORD || secrets.E2E_HOST_PASSWORD || secrets.E2E_AUTH_PASSWORD || secrets.E2E_PASSWORD }}
        run: |
          node <<'NODE'
          const fs = require('fs');

          const output = process.env.GITHUB_ENV;
          const backendUrl = String(process.env.ENTERPRISE_GATE_BACKEND_URL || '').replace(/\/+$/, '');
          const lines = [];

          function exportMasked(name, value) {
            if (!value) return;
            console.log(`::add-mask::${value}`);
            lines.push(`${name}=${value}`);
          }

          async function login(label, email, password) {
            if (!email || !password) {
              console.log(`::notice::${label} gate credentials are not configured; static JWT or CI credentials are required for strict live evidence.`);
              return null;
            }
            if (!backendUrl) throw new Error('ENTERPRISE_GATE_BACKEND_URL is required to mint dynamic gate JWTs.');

            const response = await fetch(`${backendUrl}/auth/login`, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ email, password }),
            });
            if (!response.ok) throw new Error(`${label} login failed with HTTP ${response.status}`);

            const body = await response.json().catch(() => ({}));
            if (!body.accessToken) throw new Error(`${label} login did not return accessToken.`);
            return body.accessToken;
          }

          async function main() {
            if (process.env.ENTERPRISE_GATE_ADMIN_JWT) {
              exportMasked('ENTERPRISE_GATE_ADMIN_JWT', process.env.ENTERPRISE_GATE_ADMIN_JWT);
            } else {
              exportMasked(
                'ENTERPRISE_GATE_ADMIN_JWT',
                await login('admin', process.env.ENTERPRISE_GATE_ADMIN_EMAIL, process.env.ENTERPRISE_GATE_ADMIN_PASSWORD),
              );
            }

            if (process.env.ENTERPRISE_GATE_HOST_JWT) {
              exportMasked('ENTERPRISE_GATE_HOST_JWT', process.env.ENTERPRISE_GATE_HOST_JWT);
            } else {
              exportMasked(
                'ENTERPRISE_GATE_HOST_JWT',
                await login('host', process.env.ENTERPRISE_GATE_HOST_EMAIL, process.env.ENTERPRISE_GATE_HOST_PASSWORD),
              );
            }

            if (lines.length) fs.appendFileSync(output, `${lines.join('\n')}\n`);
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Run enterprise live gate
        if: steps.enterprise_preflight.outputs.should_run == 'true'
        env:
          ENTERPRISE_GATE_ENV: staging
          ENTERPRISE_GATE_BACKEND_URL: ${{ vars.ENTERPRISE_GATE_BACKEND_URL || vars.E2E_API_URL || 'https://urban-ai-backend-staging-staging.up.railway.app' }}
          ENTERPRISE_GATE_FRONTEND_URL: ${{ vars.ENTERPRISE_GATE_FRONTEND_URL || vars.E2E_BASE_URL || 'https://urban-ai-frontend-staging-staging.up.railway.app' }}
          ENTERPRISE_GATE_HEALTH_TOKEN: ${{ secrets.ENTERPRISE_GATE_HEALTH_TOKEN || secrets.HEALTH_READINESS_TOKEN }}
          ENTERPRISE_GATE_EVENTS_INGEST_KEY: ${{ secrets.ENTERPRISE_GATE_EVENTS_INGEST_KEY }}
          ENTERPRISE_GATE_PROD_MUTATION_OK: ${{ vars.ENTERPRISE_GATE_PROD_MUTATION_OK }}
        run: >-
          node scripts/enterprise-auditability-live-gate.js
          --env=${ENTERPRISE_GATE_ENV}
          --strict
          --skip-events-ingest
          --output docs/evidence/enterprise-live-gate-${ENTERPRISE_GATE_ENV}.md

      - name: Upload enterprise evidence
        if: always() && steps.enterprise_preflight.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: enterprise-live-gate
          path: docs/evidence/enterprise-live-gate-*.md
          retention-days: 30
