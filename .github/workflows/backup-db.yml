name: Backup MySQL DB

on:
  # Diário 03:00 UTC (= 00:00 BRT). Roda mesmo se ninguém estiver olhando.
  schedule:
    - cron: '0 3 * * *'
  # Permite disparo manual no Actions UI.
  workflow_dispatch:
    inputs:
      label:
        description: 'Label opcional pro backup (ex: pre-deploy-v3)'
        required: false
        default: 'manual'

# Concorrência: nunca roda 2 backups simultâneos.
concurrency:
  group: backup-mysql
  cancel-in-progress: false

jobs:
  dump-and-upload:
    name: Dump MySQL + upload off-site (S3 ou B2)
    # O cron pertence ao repositório canônico. Forks continuam podendo executar
    # manualmente quando tiverem seus próprios secrets configurados.
    if: ${{ github.event_name == 'workflow_dispatch' || github.repository == 'urbanai-tech/urban.ai' }}
    runs-on: ubuntu-latest

    # Backup precisa terminar mesmo que demore (default 360min é suficiente).
    timeout-minutes: 60

    env:
      # Setar como GitHub Secrets:
      #  - DATABASE_URL (formato mysql://user:pass@host:port/dbname)
      # E pelo menos UM destino:
      #  - AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY + S3_BUCKET (+ AWS_REGION)
      #    OU
      #  - B2_APPLICATION_KEY_ID + B2_APPLICATION_KEY + B2_BUCKET
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      SLACK_WEBHOOK: ${{ secrets.SLACK_BACKUP_WEBHOOK }}
      LABEL: ${{ inputs.label || 'cron' }}
      # Thresholds de integridade (opcionais — definir em Settings → Variables
      # se o banco crescer/encolher). Defaults conservadores só pegam
      # catástrofe (dump vazio/truncado/sem privilégio).
      BACKUP_MIN_BYTES: ${{ vars.BACKUP_MIN_BYTES }}
      BACKUP_MIN_TABLES: ${{ vars.BACKUP_MIN_TABLES }}

    steps:
      - name: Sanity check — DATABASE_URL configurado
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret não configurado. Cadastre em Settings → Secrets."
            exit 1
          fi
          if [ -z "$S3_BUCKET" ] && [ -z "$B2_BUCKET" ]; then
            echo "::error::Nenhum destino configurado. Defina S3_BUCKET ou B2_BUCKET."
            exit 1
          fi

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Parse DATABASE_URL
        id: parse
        run: |
          # mysql://user:pass@host:port/dbname → variáveis individuais
          python - <<'PY'
          import os
          from urllib.parse import unquote, urlparse

          database_url = os.environ["DATABASE_URL"]
          parsed = urlparse(database_url)

          if parsed.scheme not in {"mysql", "mysql2"}:
              raise SystemExit(f"Unsupported DATABASE_URL scheme: {parsed.scheme}")

          db_user = unquote(parsed.username or "")
          db_pass = unquote(parsed.password or "")
          db_host = parsed.hostname or ""
          db_port = str(parsed.port or 3306)
          db_name = unquote((parsed.path or "").lstrip("/"))

          if not all([db_user, db_host, db_name]):
              raise SystemExit("DATABASE_URL must include user, host and database name")

          print(f"::add-mask::{db_pass}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"DB_USER={db_user}\n")
              output.write(f"DB_PASS={db_pass}\n")
              output.write(f"DB_HOST={db_host}\n")
              output.write(f"DB_PORT={db_port}\n")
              output.write(f"DB_NAME={db_name}\n")
          PY

      - name: Dump database
        env:
          MYSQL_PWD: ${{ steps.parse.outputs.DB_PASS }}
        run: |
          set -euo pipefail
          STAMP=$(date -u +"%Y%m%dT%H%M%SZ")
          FILE="urban-ai-${LABEL}-${STAMP}.sql.gz"
          echo "BACKUP_FILE=$FILE" >> $GITHUB_ENV
          mysqldump \
            --host="${{ steps.parse.outputs.DB_HOST }}" \
            --port="${{ steps.parse.outputs.DB_PORT }}" \
            --user="${{ steps.parse.outputs.DB_USER }}" \
            --single-transaction \
            --routines \
            --triggers \
            --events \
            --quick \
            --set-gtid-purged=OFF \
            --no-tablespaces \
            "${{ steps.parse.outputs.DB_NAME }}" \
            | gzip -9 > "$FILE"
          echo "Backup gerado: $(ls -lh $FILE | awk '{print $5, $9}')"

      - name: Verify dump integrity
        run: |
          set -euo pipefail
          MIN_BYTES="${BACKUP_MIN_BYTES:-50000}"
          MIN_TABLES="${BACKUP_MIN_TABLES:-10}"

          if [ ! -f "$BACKUP_FILE" ]; then
            echo "::error::Dump não encontrado: $BACKUP_FILE"
            exit 1
          fi

          # 1) gzip íntegro (pega corrupção / pipe interrompido)
          if ! gzip -t "$BACKUP_FILE"; then
            echo "::error::Dump corrompido — gzip -t falhou em $BACKUP_FILE"
            exit 1
          fi

          # 2) tamanho mínimo (pega dump vazio ou truncado)
          SIZE=$(stat -c%s "$BACKUP_FILE")
          if [ "$SIZE" -lt "$MIN_BYTES" ]; then
            echo "::error::Dump muito pequeno (${SIZE} bytes < ${MIN_BYTES}). Provável dump vazio/truncado."
            exit 1
          fi

          # 3) contém CREATE TABLE suficientes (pega dump sem privilégio em tabelas)
          TABLES=$(gzip -dc "$BACKUP_FILE" | grep -c -i 'CREATE TABLE' || true)
          if [ "$TABLES" -lt "$MIN_TABLES" ]; then
            echo "::error::Dump incompleto — apenas ${TABLES} CREATE TABLE (< ${MIN_TABLES})."
            exit 1
          fi

          SHA=$(sha256sum "$BACKUP_FILE" | awk '{print $1}')
          echo "BACKUP_SHA256=$SHA" >> "$GITHUB_ENV"
          echo "Dump íntegro: ${SIZE} bytes, ${TABLES} tabelas, sha256=${SHA}"

      - name: Upload to AWS S3
        if: ${{ env.S3_BUCKET != '' }}
        run: |
          set -euo pipefail
          REGION="${AWS_REGION:-us-east-1}"
          export AWS_REGION="$REGION"
          export AWS_DEFAULT_REGION="$REGION"

          if ! aws s3api head-bucket --bucket "$S3_BUCKET" 2>/dev/null; then
            echo "S3 bucket not found or not accessible; attempting to create it."
            if [ "$REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$S3_BUCKET"
            else
              aws s3api create-bucket \
                --bucket "$S3_BUCKET" \
                --region "$REGION" \
                --create-bucket-configuration LocationConstraint="$REGION"
            fi
            aws s3api wait bucket-exists --bucket "$S3_BUCKET"
            aws s3api put-public-access-block \
              --bucket "$S3_BUCKET" \
              --public-access-block-configuration BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
            aws s3api put-bucket-encryption \
              --bucket "$S3_BUCKET" \
              --server-side-encryption-configuration '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          fi

          aws s3 cp "$BACKUP_FILE" "s3://$S3_BUCKET/mysql/$BACKUP_FILE" \
            --storage-class STANDARD_IA
          echo "✅ Uploaded to s3://$S3_BUCKET/mysql/$BACKUP_FILE"

      - name: Upload to Backblaze B2
        if: ${{ env.B2_BUCKET != '' && env.S3_BUCKET == '' }}
        run: |
          set -euo pipefail
          pip install --quiet b2
          b2 authorize-account "$B2_APPLICATION_KEY_ID" "$B2_APPLICATION_KEY"
          b2 upload-file "$B2_BUCKET" "$BACKUP_FILE" "mysql/$BACKUP_FILE"
          echo "✅ Uploaded to b2://$B2_BUCKET/mysql/$BACKUP_FILE"

      - name: Notify on success (optional Slack/Discord)
        if: ${{ success() && env.SLACK_WEBHOOK != '' }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"✅ Backup Urban AI MySQL OK — $BACKUP_FILE (sha256 ${BACKUP_SHA256:-n/a})\"}" \
            "$SLACK_WEBHOOK"

      - name: Notify on failure
        if: ${{ failure() && env.SLACK_WEBHOOK != '' }}
        run: |
          curl -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\"🚨 Backup Urban AI MySQL FALHOU — ver Action #${{ github.run_id }}\"}" \
            "$SLACK_WEBHOOK"
