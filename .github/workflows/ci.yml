name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ===================== Repository safety =====================

  repository-gates:
    name: Repository - secrets, artifacts and documentation links
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - name: Verify security scanner detectors
        run: node scripts/security-head-scan.js --self-test
      - name: Detect secrets and sensitive artifacts in tracked HEAD
        run: node scripts/security-head-scan.js
      - name: Audit local documentation links
        run: node scripts/audit-document-links.js
      - name: Verify SLO probe and percentile report
        run: node scripts/slo-probe.js --self-test
      - name: Verify resilience and DR gate detectors
        run: npm run audit:resilience-dr:self-test
      - name: Audit backup, restore, rollback and DR contracts
        run: npm run audit:resilience-dr
      - name: Verify KNN legacy dependency detectors
        run: npm run audit:knn-legacy:self-test
      - name: Prevent new consumers of the legacy KNN service
        run: npm run audit:knn-legacy
      - name: Audit root production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Gitleaks defense-in-depth scan of HEAD commit
        uses: docker://ghcr.io/gitleaks/gitleaks:v8.30.1
        with:
          args: git /github/workspace --log-opts=HEAD^..HEAD --redact --exit-code=1 --no-banner --max-target-megabytes=5 --timeout=120

  # ===================== Backend =====================

  backend-test:
    name: Backend — typecheck + jest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-ai-backend-main
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: urban-ai-backend-main/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: ESLint zero-warning gate
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Audit runtime DTO coverage for request bodies
        run: npm run audit:body-dtos
      - name: Jest unit + integration
        run: npx jest --passWithNoTests --ci
      - name: OpenAPI critical compatibility contract
        run: npm run contract:openapi
      - name: Enforce 90% coverage on certified critical modules
        run: npm run test:coverage:certified
      - name: Verify LGPD control gate detectors
        run: npm run audit:lgpd:self-test
      - name: Audit LGPD authorization, consent and cascade contracts
        run: npm run audit:lgpd
      - name: Verify observability security gate detectors
        run: npm run audit:observability:self-test
      - name: Audit Sentry, correlation and redaction contracts
        run: npm run audit:observability
      - name: Verify authorization gate detectors
        run: npm run audit:authorization:self-test
      - name: Audit mutable and administrative route authorization
        run: npm run audit:authorization
      - name: Verify scheduled-job audit detectors
        run: npm run audit:cron:self-test
      - name: Audit cron timezone, overlap, idempotency and AdminJobRun coverage
        run: npm run audit:cron:strict
      - name: Migration coverage audit
        run: npm run audit:migrations:strict
      - name: MySQL backup dry-run
        run: npm run backup:mysql:dry
      - name: MySQL backup guardrail self-test
        run: npm run backup:mysql:self-test
      - name: Restore verifier guardrail self-test
        run: npm run restore:verify:self-test

  backend-build:
    name: Backend — nest build (prod artifact)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-ai-backend-main
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: urban-ai-backend-main/package-lock.json
      - run: npm ci
      - name: Nest build
        run: npm run build
      - name: Verify dist/main.js exists
        run: test -f dist/main.js

  backend-migrations:
    name: Backend — migrations dry-run against MySQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-ai-backend-main
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_DATABASE: ai_urban_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -prootpw"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: rootpw
      DB_NAME: ai_urban_ci
      DB_SYNCHRONIZE: 'false'
      MIGRATIONS_RUN: 'true'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: urban-ai-backend-main/package-lock.json
      - run: npm ci
      - name: Wait for MySQL
        run: |
          for i in $(seq 1 30); do
            if mysqladmin ping -h 127.0.0.1 -uroot -prootpw --silent; then
              echo "MySQL ready"; break
            fi
            echo "waiting MySQL... ($i)"; sleep 2
          done
      - name: Run migrations (validate they apply cleanly to fresh DB)
        run: npm run migration:run

  # ===================== Frontend =====================

  frontend-test:
    name: Frontend — typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Urban-front-main
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: ESLint zero-warning gate
        run: npm run lint
      - name: Frontend unit and contract tests
        run: npm run test:unit
      - name: Verify design debt non-regression detectors
        run: npm run design:debt:self-test
      - name: Design system audit (forbidden libs, debt baseline and catalog)
        run: npm run design:audit
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Next.js build
        run: npm run build
        env:
          # Mocks só pra build CI passar — não vão pra runtime.
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
          NEXTAUTH_SECRET: ci_dummy_secret_not_for_prod
          NEXTAUTH_URL: http://localhost:3000

  # ===================== Python services =====================

  webscraping-test:
    name: Webscraping - pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-webscraping-main
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: urban-webscraping-main/uv.lock
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff lint
        run: uv run ruff check urban_webscrapping tests auth_proxy.py
      - name: Ruff formatting gate
        run: uv run ruff format --check urban_webscrapping tests auth_proxy.py
      - name: Mypy strict typing gate
        run: uv run mypy urban_webscrapping auth_proxy.py
      - name: Pytest
        run: uv run pytest -q

  pipeline-test:
    name: Pipeline - pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: urban-pipeline-main
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-python@v6.2.0
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: urban-pipeline-main/uv.lock
      - name: Install dependencies
        run: uv sync --all-groups --frozen
      - name: Ruff and mypy quality gate
        run: uv run poe lint
      - name: Pytest
        run: uv run pytest tests -q

  # ===================== Auxiliary Node services =====================

  auxiliary-node-services:
    name: Auxiliary Node - dashboard and KNN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            dashboard/package-lock.json
            urban-ai-knn-main/package-lock.json
      - name: Dashboard clean install, audit, build and bundle budget
        working-directory: dashboard
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=moderate
          npm run build
      - name: KNN clean install, audit, contracts and syntax smoke
        working-directory: urban-ai-knn-main
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=moderate
          npm test
          node --check server.js

  # ===================== Release evidence =====================

  release-evidence:
    name: Release - evidence dry-run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
      - name: Generate release evidence preview
        run: node scripts/release-evidence.js --dry-run
      - name: Enterprise auditability gate dry-run
        run: node scripts/enterprise-auditability-live-gate.js --dry-run

  # ===================== E2E (mocked local app) =====================

  frontend-e2e-mock-local:
    name: Frontend - Playwright mocked local E2E
    runs-on: ubuntu-latest
    needs: [frontend-test]
    defaults:
      run:
        working-directory: Urban-front-main
    env:
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3001
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_dummy
      NEXTAUTH_SECRET: ci_dummy_secret_not_for_prod
      NEXTAUTH_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Guard local-only E2E targets
        run: |
          test "$E2E_BASE_URL" = "http://127.0.0.1:3000"
          test "$NEXT_PUBLIC_API_URL" = "http://127.0.0.1:3001"
          case "$E2E_BASE_URL $NEXT_PUBLIC_API_URL" in
            *myurbanai*|*railway*|*production*|*staging*) exit 1 ;;
          esac
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build local app
        run: npm run build
      - name: Start local app
        run: |
          cp -r .next/static .next/standalone/.next/static
          if [ -d public ]; then cp -r public .next/standalone/public; fi
          PORT=3000 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/urban-front-next.log 2>&1 &
          echo $! > /tmp/urban-front-next.pid
      - name: Wait for local app
        run: |
          for i in $(seq 1 30); do
            if curl --silent --fail "$E2E_BASE_URL" >/dev/null; then
              echo "Next.js ready"; exit 0
            fi
            echo "waiting Next.js... ($i)"; sleep 2
          done
          cat /tmp/urban-front-next.log
          exit 1
      - name: Run mocked local E2E tests
        run: npx playwright test --project=chromium
      - name: Upload mocked local Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report-mock-local
          path: Urban-front-main/playwright-report/
          retention-days: 14

  # ===================== E2E (only if staging URL configured) =====================

  frontend-smoke:
    name: Frontend - Playwright public smoke
    runs-on: ubuntu-latest
    needs: [frontend-test]
    # Em PR, o codigo novo e validado pelo E2E local acima. O smoke remoto
    # volta a bloquear no push, quando o ambiente pode refletir o SHA publicado.
    if: ${{ github.event_name != 'pull_request' && vars.E2E_BASE_URL != '' }}
    defaults:
      run:
        working-directory: Urban-front-main
    env:
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json
      - run: npm ci --legacy-peer-deps
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run public smoke tests
        run: npx playwright test smoke.spec.ts release-gate-public.spec.ts --project=chromium
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: Urban-front-main/playwright-report/
          retention-days: 14

  product-audit:
    name: Produto - E2E audit admin/host
    runs-on: ubuntu-latest
    needs: [frontend-test]
    if: ${{ vars.E2E_PRODUCT_AUDIT_ENABLED == 'true' && vars.E2E_BASE_URL != '' && vars.E2E_API_URL != '' }}
    defaults:
      run:
        working-directory: Urban-front-main
    env:
      E2E_TARGET_ENV: staging
      E2E_AUDIT_MODE: all
      E2E_BASE_URL: ${{ vars.E2E_BASE_URL }}
      E2E_API_URL: ${{ vars.E2E_API_URL }}
      E2E_EMAIL: ${{ secrets.E2E_EMAIL || secrets.E2E_AUTH_EMAIL }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || secrets.E2E_AUTH_PASSWORD }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Urban-front-main/package-lock.json
      - name: Preflight product audit
        id: product_audit_preflight
        run: node ./scripts/staging-gate-preflight.mjs --gate product-audit
      - if: steps.product_audit_preflight.outputs.should_run == 'true'
        run: npm ci --legacy-peer-deps
      - name: Install Playwright Chromium
        if: steps.product_audit_preflight.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium
      - name: Run product audit
        if: steps.product_audit_preflight.outputs.should_run == 'true'
        run: node ./scripts/e2e-product-audit.js
      - name: Upload product audit report
        if: always() && steps.product_audit_preflight.outputs.should_run == 'true'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: product-e2e-audit
          path: docs/e2e-reports/
          retention-days: 14
